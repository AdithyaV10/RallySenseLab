[project]
name = "rallysense-api"
version = "0.2.0"
description = "RallySense Lab local movement research API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.2",
  "sqlalchemy==2.1.6", "alembic==1.20.1", "psycopg[binary]==3.3.7",
  "numpy==2.5.4", "scipy==1.18.1", "pyarrow==26.0.0",
  "python-multipart==0.0.33", "httpx>=0.28,<1", "pytest==9.2.0", "ruff>=0.14,<1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rallysense"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
