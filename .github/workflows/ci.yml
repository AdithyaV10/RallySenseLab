name: Verify local research application
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.23', python-version: '3.13'}
      - run: uv sync --project apps/api --frozen
      - run: npm ci --prefix apps/web
      - run: node scripts/fetch-assets.mjs
      - run: node scripts/check-contracts.mjs
      - run: uv run --project apps/api ruff check apps/api/src apps/api/tests apps/api/migrations
      - run: npm --prefix apps/web run lint && npm --prefix apps/web run typecheck && npm --prefix apps/web test
      - run: docker compose up -d --build
      - run: docker compose exec -T api pytest -q
      - run: docker compose exec -T api alembic check
      - run: python scripts/fetch-verification-video.py
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - run: npm --prefix apps/web run test:e2e
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-verification
          path: |
            compose.log
            apps/web/test-results
            docs/evidence/*.png
      - if: always()
        run: docker compose down
